
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmando conta - FatoCheck!</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            font-family: Poppins, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ede9fe;
        }

        main {
            background: white;
            width: 90%;
            max-width: 450px;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px #0002;
            text-align: center;
        }

        h1 {
            color: #7c3aed;
        }

        #mensagem {
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>
    <main>
        <h1>🛑 FatoCheck!</h1>
        <h2>Confirmando sua conta...</h2>
        <p id="mensagem">Aguarde um instante.</p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
    const SUPABASE_URL =
        "https://joajolboddinnajxrnop.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_EEaShgemq6o_yjfZSnwCJA_9gV1OJyc";

    const clienteSupabase = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
            auth: {
                detectSessionInUrl: false
            }
        }
    );

    const mensagem = document.getElementById("mensagem");
    const parametros = new URLSearchParams(window.location.search);

    const destinoSolicitado = parametros.get("destino");

    const paginaDestino =
        destinoSolicitado === "quiz.html"
            ? "quiz.html"
            : "index.html";

    async function confirmarConta() {
        try {
            const codigo = parametros.get("code");

            if (codigo) {
                const { error } =
                    await clienteSupabase.auth.exchangeCodeForSession(codigo);

                if (error) throw error;
            } else {
                const hash = new URLSearchParams(
                    window.location.hash.substring(1)
                );

                const access_token = hash.get("access_token");
                const refresh_token = hash.get("refresh_token");
                const erroEmail = hash.get("error_description");

                if (erroEmail) {
                    throw new Error(
                        erroEmail.replace(/\+/g, " ")
                    );
                }

                if (access_token && refresh_token) {
                    const { error } =
                        await clienteSupabase.auth.setSession({
                            access_token,
                            refresh_token
                        });

                    if (error) throw error;
                }
            }

            const { data, error } =
                await clienteSupabase.auth.getSession();

            if (error) throw error;

            if (!data.session) {
                throw new Error(
                    "A confirmação não criou uma sessão neste navegador. Tente abrir o link no mesmo navegador em que iniciou o cadastro."
                );
            }

            mensagem.textContent =
                "✅ Conta confirmada! Redirecionando...";

            // Limpa os tokens da barra de endereço.
            window.history.replaceState(
                {},
                document.title,
                window.location.pathname
            );

            setTimeout(function() {
                window.location.replace(paginaDestino);
            }, 1000);

        } catch (erro) {
            console.error("Erro ao confirmar conta:", erro);

            mensagem.textContent =
                "Não foi possível concluir o acesso automaticamente. " +
                (erro.message || "Tente entrar pela página de login.");

            const link = document.createElement("a");
            link.href = "login.html?origem=" + paginaDestino.replace(".html", "");
            link.textContent = " Ir para o login";
            mensagem.appendChild(document.createElement("br"));
            mensagem.appendChild(link);
        }
    }

    confirmarConta();
    </script>
</body>
</html>
